name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  transport-and-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python krita_plugin/test_validation.py
      - run: python krita_plugin/test_regions.py
